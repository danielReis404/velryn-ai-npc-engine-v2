[project]
name = "agent-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Reis", email = "danielreisp.2020@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.18",
    "langchain-cerebras>=0.8.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-mistralai>=1.1.6",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "langsmith>=0.11.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.28.0"]

[tool.uv]
# This project is an application (FastAPI is served via `uvicorn
# app.main:app`), not an installable library -- it doesn't need a build
# backend or an entry point. "package = false" makes uv treat this as a
# "virtual" project: it only resolves and installs dependencies, without
# trying to package `app/`.
package = false
